site_name: Yxene
site_url: https://yxene.com
repo_url: https://github.com/Yxene/yxene.github.io
site_description: "Yxene's website ! You can find my writeups and challenges here."

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: fontawesome/regular/flag
    admonition:
      warning: material/alert
    repo: fontawesome/brands/github
  palette:

    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: teal
      accent: indigo

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
      primary: amber
      accent: amber
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - content.code.copy

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.highlight:
      auto_title: true
      linenums: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Yxene
    - icon: simple/rootme
      link: https://www.root-me.org/Yxene

plugins:
  - git-revision-date-localized:
      enable_creation_date: true
  - search

